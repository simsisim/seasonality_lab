name: Seasonality Charts

on:
  workflow_dispatch:
    inputs:
      nasdaq100:
        description: 'NASDAQ-100 (101 tickers)'
        type: boolean
        default: false
      sp500:
        description: 'S&P 500 (503 tickers)'
        type: boolean
        default: false
      iwm1000:
        description: 'IWM 1000 (1008 tickers)'
        type: boolean
        default: false
      russell3000:
        description: 'Russell 3000 (2586 tickers)'
        type: boolean
        default: false
      workers:
        description: 'Parallel workers (4–8 recommended)'
        type: string
        default: '4'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug data download
        run: |
          python - <<'EOF'
          import yfinance as yf, sys
          print("yfinance version:", yf.__version__)
          t = yf.Ticker("AAPL")
          df = t.history(start="2000-01-01", interval="1d")
          print("AAPL rows:", len(df))
          print("Columns:", list(df.columns))
          if df.empty:
              print("ERROR: AAPL data is EMPTY")
              sys.exit(1)
          else:
              print("OK - first row:", df.index[0], df["Close"].iloc[0])
          EOF

      - name: Run NASDAQ-100
        if: ${{ inputs.nasdaq100 }}
        run: python seasonality_cli.py user_input/jobs/ndx100_standard_charts.csv --workers ${{ inputs.workers }}

      - name: Debug AAPL output
        if: ${{ inputs.nasdaq100 }}
        run: |
          echo "=== AAPL calendar stats ==="
          cat output/ndx100/ndx_calendar_ab_AAPL_stats.csv || echo "FILE NOT FOUND"
          echo "=== AAPL monthly stats ==="
          head -3 output/ndx100/ndx_monthly_wr_AAPL_stats.csv || echo "FILE NOT FOUND"

      - name: Run S&P 500
        if: ${{ inputs.sp500 }}
        run: python seasonality_cli.py user_input/jobs/sp500_standard_charts.csv --workers ${{ inputs.workers }}

      - name: Run IWM 1000
        if: ${{ inputs.iwm1000 }}
        run: python seasonality_cli.py user_input/jobs/iwm1000_standard_charts.csv --workers ${{ inputs.workers }}

      - name: Run Russell 3000
        if: ${{ inputs.russell3000 }}
        run: python seasonality_cli.py user_input/jobs/russell3000_standard_charts.csv --workers ${{ inputs.workers }}

      - name: Upload charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seasonality-charts-${{ github.run_number }}
          path: output/
          retention-days: 30
