name: Seasonality Charts

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Test (5 tickers — run this first to verify the pipeline)'
        type: boolean
        default: false
      nasdaq100:
        description: 'NASDAQ-100 (101 tickers)'
        type: boolean
        default: false
      sp500:
        description: 'S&P 500 (503 tickers)'
        type: boolean
        default: false
      iwm1000:
        description: 'IWM 1000 (1008 tickers)'
        type: boolean
        default: false
      russell3000:
        description: 'Russell 3000 (2586 tickers)'
        type: boolean
        default: false
      workers:
        description: 'Parallel workers (use 1 to avoid yfinance rate limits; 4+ only if you have a local cache)'
        type: string
        default: '1'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug pipeline
        run: |
          python - <<'EOF'
          import pandas as pd, yfinance as yf, sys
          print("pandas:", pd.__version__, "| yfinance:", yf.__version__)

          # Step 1: download
          t = yf.Ticker("AAPL")
          raw = t.history(start="2000-01-01", interval="1d")
          print("raw rows:", len(raw), "| columns:", list(raw.columns))
          print("raw close sample:", raw["Close"].head(3).tolist())

          # Step 2: standardize (same as DataLoader._standardize_dataframe)
          import numpy as np
          df = raw.copy()
          df.columns = df.columns.str.lower().str.strip()
          df["timestamp"] = df.index.astype(np.int64) // 10**9
          df = df[["timestamp","open","high","low","close","volume"]].copy()
          df = df.reset_index(drop=True)
          print("std close sample:", df["close"].head(3).tolist())

          # Step 3: stamp
          sys.path.insert(0, ".")
          from src.core.stamper import stamp_data
          df2 = stamp_data(df)
          print("stamp rows:", len(df2), "| day sample:", df2["day"].head(5).tolist())
          print("close after stamp:", df2["close"].head(3).tolist())

          # Step 4: pct_change
          df2["daily_return"] = df2["close"].pct_change() * 100.0
          df2 = df2.dropna(subset=["daily_return"])
          print("after pct_change rows:", len(df2))
          day1 = df2[df2["day"] == 1]
          print("day==1 count:", len(day1), "| sample:", day1["daily_return"].head(3).tolist())
          EOF

      - name: Run Test (5 tickers)
        if: ${{ inputs.test }}
        run: python seasonality_cli.py user_input/jobs/test_standard_charts.csv --workers ${{ inputs.workers }}

      - name: Run NASDAQ-100
        if: ${{ inputs.nasdaq100 }}
        run: python seasonality_cli.py user_input/jobs/ndx100_standard_charts.csv --workers ${{ inputs.workers }}

      - name: Run S&P 500
        if: ${{ inputs.sp500 }}
        run: python seasonality_cli.py user_input/jobs/sp500_standard_charts.csv --workers ${{ inputs.workers }}

      - name: Run IWM 1000
        if: ${{ inputs.iwm1000 }}
        run: python seasonality_cli.py user_input/jobs/iwm1000_standard_charts.csv --workers ${{ inputs.workers }}

      - name: Run Russell 3000
        if: ${{ inputs.russell3000 }}
        run: python seasonality_cli.py user_input/jobs/russell3000_standard_charts.csv --workers ${{ inputs.workers }}

      - name: Upload charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seasonality-charts-${{ github.run_number }}
          path: output/
          retention-days: 30
